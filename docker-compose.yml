name: geoatlas

services:
  geoatlas:
    image: ghcr.io/kazuzjkee/geoatlas:main
    pull_policy: always
    container_name: geoatlas_app
    ports:
      - "8067:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - CARTO_KEY=${CARTO_KEY}
      - GEOATLAS_DATA_DIR=/app/data
      - DUEL_DATA_DIR=/app/data
    volumes:
      - geoatlas_data:/app/data
    restart: unless-stopped

volumes:
  geoatlas_data:
